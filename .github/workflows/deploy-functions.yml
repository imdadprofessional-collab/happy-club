name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  # Job-level `if:` can't reference `secrets` directly (GitHub rejects the
  # whole workflow file if it does, failing every run instantly with no job
  # ever scheduled — that's what happened here). So the "is it configured
  # yet" check runs as its own tiny job first, and the real job gates on
  # *its* output instead.
  check-secret:
    name: Check GCP_SA_KEY is set
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  deploy:
    name: Deploy coachChat to Firebase
    needs: check-secret
    if: needs.check-secret.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set GEMINI_API_KEY in Secret Manager
        run: |
          echo -n "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY \
            --data-file - --force --project happy-club-156a5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy functions
        run: firebase deploy --only functions --project happy-club-156a5 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
