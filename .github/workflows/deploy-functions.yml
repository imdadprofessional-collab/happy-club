name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy coachChat to Firebase
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set GEMINI_API_KEY in Secret Manager
        run: |
          echo -n "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY \
            --data-file - --force --project happy-club-156a5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy functions
        run: firebase deploy --only functions --project happy-club-156a5 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
