name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Analyze, test, and build APKs
    runs-on: ubuntu-latest
    env:
      # `if:` conditions can't reference `secrets` directly (GitHub rejects
      # the whole workflow file if they do — it fails every run instantly
      # with no job ever scheduled, which is what happened here for a
      # while). Route it through `env:` first instead.
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # If the release-signing secrets are set (see README for the four
      # secret names), decode the keystore and write android/key.properties
      # so the release build/bundle below are signed with the real upload
      # key instead of falling back to the debug key.
      - name: Configure release signing
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (for Play Store upload)
        run: flutter build appbundle --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-club-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-club-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5

      - name: Upload release App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-club-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 5
